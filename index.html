<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS</title>

<style>

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;

    height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

h1 {
    font-size: 32px;
    letter-spacing: 6px;
    margin-bottom: 10px;
}

p {
    color: #aaa;
    font-size: 18px;
    max-width: 90%;
    line-height: 1.5;
}

#listaVozes {
    margin-top: 15px;
    color: #777;
    font-size: 14px;
    max-width: 90%;
}

button {
    margin-top: 30px;
    padding: 18px 25px;

    border: 1px solid white;
    border-radius: 50px;

    background: transparent;
    color: white;

    font-size: 16px;
}

button:active {
    background: white;
    color: black;
}

</style>

</head>

<body>

<h1>J.A.R.V.I.S.</h1>

<p id="mensagem">
Boa noite, senhor.
</p>

<div id="listaVozes"></div>

<button onclick="ouvir()">
🎙️ Falar com JARVIS
</button>


<script>

/* ==========================================
   SISTEMA DE VOZ
   ========================================== */

let vozes = [];

let vozSelecionada = null;


/* ==========================================
   CARREGAR VOZES DO CELULAR
   ========================================== */

function carregarVozes() {

    vozes =
        window.speechSynthesis.getVoices();

    vozes =
        vozes.filter(function(voz) {

            return voz.lang
                .toLowerCase()
                .startsWith("pt");

        });

    mostrarVozes();
}


/* ==========================================
   MOSTRAR VOZES NA TELA
   ========================================== */

function mostrarVozes() {

    const lista =
        document.getElementById("listaVozes");

    if (vozes.length === 0) {

        lista.innerText =
            "Nenhuma voz em português encontrada.";

        return;
    }


    let texto =
        "Vozes disponíveis: ";

    for (
        let i = 0;
        i < vozes.length;
        i++
    ) {

        texto +=
            (i + 1) +
            ". " +
            vozes[i].name;

        if (i < vozes.length - 1) {

            texto += " | ";
        }
    }

    lista.innerText = texto;
}


/* ==========================================
   CARREGAR QUANDO O CELULAR DISPONIBILIZAR
   ========================================== */

window.speechSynthesis.onvoiceschanged =
    carregarVozes;

carregarVozes();


/* ==========================================
   JARVIS FALA
   ========================================== */

function falar(texto) {

    const voz =
        new SpeechSynthesisUtterance(texto);


    voz.lang = "pt-BR";


    if (vozSelecionada) {

        voz.voice =
            vozSelecionada;
    }


    /*
    VELOCIDADE
    1 = normal
    Menor = mais lento
    Maior = mais rápido
    */

    voz.rate = 0.95;


    /*
    TOM
    1 = normal
    Menor = mais grave
    Maior = mais agudo
    */

    voz.pitch = 0.85;


    voz.volume = 1;


    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(voz);
}


/* ==========================================
   TESTAR UMA VOZ
   ========================================== */

function testarVoz(numero) {

    if (
        numero < 1 ||
        numero > vozes.length
    ) {

        falar(
            "Essa voz não está disponível, senhor."
        );

        return;
    }


    vozSelecionada =
        vozes[numero - 1];


    const mensagem =
        "Olá, senhor. Esta é a voz número " +
        numero +
        ".";


    document.getElementById("mensagem")
        .innerText =
        mensagem;


    falar(mensagem);
}


/* ==========================================
   RECONHECIMENTO DE VOZ
   ========================================== */

function ouvir() {

    const mensagem =
        document.getElementById("mensagem");


    const Reconhecimento =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!Reconhecimento) {

        mensagem.innerText =
            "Seu navegador não suporta reconhecimento de voz.";

        falar(
            "Senhor, este navegador não suporta reconhecimento de voz."
        );

        return;
    }


    const reconhecimento =
        new Reconhecimento();


    reconhecimento.lang =
        "pt-BR";


    reconhecimento.continuous =
        false;


    reconhecimento.interimResults =
        false;


    mensagem.innerText =
        "🎙️ Estou ouvindo...";


    reconhecimento.start();


    reconhecimento.onresult =
        function(event) {

            const texto =
                event.results[0][0]
                .transcript;


            mensagem.innerText =
                "Você disse: " +
                texto;


            responder(texto);
        };


    reconhecimento.onerror =
        function(event) {

            mensagem.innerText =
                "Erro no microfone: " +
                event.error;
        };

}


/* ==========================================
   COMANDOS DO JARVIS
   ========================================== */

function responder(texto) {

    texto =
        texto.toLowerCase().trim();


    /*
    TESTAR VOZES
    */

    if (
        texto.includes("testar vozes") ||
        texto.includes("teste de voz") ||
        texto.includes("testar voz")
    ) {

        if (vozes.length === 0) {

            falar(
                "Senhor, não encontrei vozes em português disponíveis."
            );

            return;
        }


        document.getElementById("mensagem")
            .innerText =
            "Encontrei " +
            vozes.length +
            " vozes. Diga, por exemplo: voz 1.";


        falar(
            "Encontrei " +
            vozes.length +
            " vozes em português. Diga o número da voz que deseja testar."
        );


        return;
    }


    /*
    ESCOLHER VOZ
    */

    const numeroEncontrado =
        texto.match(/\d+/);


    if (
        numeroEncontrado &&
        (
            texto.includes("voz") ||
            texto.includes("número") ||
            texto.includes("numero")
        )
    ) {

        const numero =
            parseInt(
                numeroEncontrado[0]
            );


        testarVoz(numero);

        return;
    }


    /*
    OK JARVIS
    */

    if (
        texto.includes("ok jarvis") ||
        texto.includes("okay jarvis")
    ) {

        falar(
            "Sim, senhor. Estou ouvindo."
        );

        document.getElementById("mensagem")
            .innerText =
            "Sim, senhor. Estou ouvindo.";

        return;
    }


    /*
    SAUDAÇÃO
    */

    if (
        texto.includes("oi") ||
        texto.includes("olá") ||
        texto.includes("ola")
    ) {

        falar(
            "Olá, senhor. Como posso ajudar?"
        );

        document.getElementById("mensagem")
            .innerText =
            "Olá, senhor. Como posso ajudar?";

        return;
    }


    /*
    QUEM É VOCÊ
    */

    if (
        texto.includes("quem é você") ||
        texto.includes("quem e você") ||
        texto.includes("quem e voce")
    ) {
