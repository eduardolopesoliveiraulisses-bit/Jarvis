<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>JARVIS</title>

<style>

body {

    margin: 0;

    background: #050505;

    color: white;

    font-family: Arial, sans-serif;

    text-align: center;

    height: 100vh;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

}

h1 {

    font-size: 34px;

    letter-spacing: 7px;

    margin-bottom: 10px;

}

#status {

    color: #aaa;

    font-size: 17px;

    max-width: 90%;

    line-height: 1.5;

}

#debug {

    color: #777;

    font-size: 13px;

    margin-top: 15px;

    max-width: 90%;

}

button {

    margin-top: 30px;

    padding: 18px 28px;

    border: 1px solid white;

    border-radius: 50px;

    background: transparent;

    color: white;

    font-size: 16px;

}

button:active {

    background: white;

    color: black;

}

</style>

</head>


<body>


<h1>J.A.R.V.I.S.</h1>


<div id="status">

Sistema pronto.

</div>


<div id="debug">

Aguardando comando...

</div>


<button onclick="ouvir()">

🎙️ Falar com JARVIS

</button>



<script>


/* =================================
   ELEMENTOS DA TELA
   ================================= */

const status =
document.getElementById("status");

const debug =
document.getElementById("debug");



/* =================================
   TESTE DE VOZ
   ================================= */

function falar(texto) {

    debug.innerText =
        "Teste de voz: tentando falar...";


    if (!("speechSynthesis" in window)) {

        debug.innerText =
            "ERRO: síntese de voz não disponível.";

        return;

    }


    window.speechSynthesis.cancel();


    const fala =
        new SpeechSynthesisUtterance(texto);


    fala.lang = "pt-BR";

    fala.rate = 0.95;

    fala.pitch = 0.85;

    fala.volume = 1;


    fala.onstart = function() {

        debug.innerText =
            "Voz funcionando.";

    };


    fala.onend = function() {

        debug.innerText =
            "Fala terminou.";

    };


    fala.onerror = function(event) {

        debug.innerText =
            "ERRO NA VOZ: " +
            event.error;

    };


    window.speechSynthesis.speak(fala);

}



/* =================================
   RECONHECIMENTO DE VOZ
   ================================= */

function ouvir() {


    status.innerText =
        "🎙️ Estou ouvindo...";


    debug.innerText =
        "Iniciando microfone...";


    const Reconhecimento =

        window.SpeechRecognition ||

        window.webkitSpeechRecognition;


    if (!Reconhecimento) {

        status.innerText =
            "Reconhecimento de voz não disponível.";

        debug.innerText =
            "ERRO: SpeechRecognition não encontrado.";

        return;

    }


    const reconhecimento =
        new Reconhecimento();


    reconhecimento.lang =
        "pt-BR";


    reconhecimento.continuous =
        false;


    reconhecimento.interimResults =
        false;


    reconhecimento.onstart = function() {

        status.innerText =
            "🎙️ Pode falar, senhor.";

        debug.innerText =
            "Microfone iniciado.";

    };


    reconhecimento.onresult =
        function(event) {


            const texto =

                event
                .results[0][0]
                .transcript;


            status.innerText =

                "Você disse: " +
                texto;


            debug.innerText =
                "Reconhecimento funcionando.";


            responder(texto);

        };


    reconhecimento.onerror =
        function(event) {


            status.innerText =
                "Erro no reconhecimento.";


            debug.innerText =
                "ERRO DO MICROFONE: " +
                event.error;

        };


    reconhecimento.onend =
        function() {

            console.log(
                "Reconhecimento encerrado."
            );

        };


    try {

        reconhecimento.start();

    }

    catch (erro) {

        debug.innerText =
            "ERRO AO INICIAR: " +
            erro.message;

    }

}



/* =================================
   RESPOSTAS
   ================================= */

function responder(texto) {


    texto =
        texto.toLowerCase();


    if (
        texto.includes("oi") ||
        texto.includes("olá") ||
        texto.includes("ola")
    ) {


        const resposta =
            "Olá, senhor. Como posso ajudar?";


        status.innerText =
            resposta;


        falar(resposta);


        return;

    }



    if (
        texto.includes("ok jarvis") ||
        texto.includes("okay jarvis")
    ) {


        const resposta =
            "Sim, senhor. Estou ouvindo.";


        status.innerText =
            resposta;


        falar(resposta);


        return;

    }



    if (
        texto.includes("quem é você") ||
        texto.includes("quem e voce")
    ) {


        const resposta =
            "Eu sou JARVIS, seu assistente pessoal.";


        status.innerText =
            resposta;


        falar(resposta);


        return;

    }



    if (
        texto.includes("obrigado") ||
        texto.includes("obrigada")
    ) {


        const resposta =
            "Sempre às ordens, senhor.";


        status.innerText =
            resposta;


        falar(resposta);


        return;

    }



    const resposta =

        "Comando recebido, senhor. Ainda estou aprendendo a responder a esse comando.";


    status.innerText =
        resposta;


    falar(resposta);

}



</script>


</body>

</html>
