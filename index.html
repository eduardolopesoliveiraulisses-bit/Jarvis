<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at center, #10202a 0%, #05090d 38%, #000 75%);
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* LINHAS DE FUNDO */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        linear-gradient(rgba(0,180,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,180,255,0.035) 1px, transparent 1px);
    background-size: 35px 35px;
    pointer-events: none;
}

/* INTERFACE */

.jarvis {
    width: 100%;
    max-width: 500px;
    min-height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 35px 20px 25px;
}

/* CABEÇALHO */

.header {
    text-align: center;
    z-index: 5;
}

.logo {
    font-size: 25px;
    letter-spacing: 8px;
    font-weight: bold;
    color: #ffffff;
    text-shadow:
        0 0 8px #00aaff,
        0 0 20px rgba(0,170,255,0.5);
}

.subtitle {
    margin-top: 8px;
    font-size: 10px;
    letter-spacing: 4px;
    color: #6c8995;
}

/* NÚCLEO */

.core-container {
    position: relative;
    width: 290px;
    height: 290px;
    margin-top: 35px;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* BRILHO */

.core-glow {
    position: absolute;
    width: 170px;
    height: 170px;
    border-radius: 50%;
    background: #00aaff;
    opacity: 0.08;
    filter: blur(30px);
    animation: glow 2.5s ease-in-out infinite;
}

/* ANEL EXTERNO */

.ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(0,174,255,0.45);
}

.ring-one {
    width: 280px;
    height: 280px;
    border-top-color: #00aaff;
    border-bottom-color: rgba(0,255,150,0.35);
    animation: spin 12s linear infinite;
}

.ring-two {
    width: 235px;
    height: 235px;
    border-left-color: #00aaff;
    border-right-color: rgba(255,255,255,0.35);
    animation: spinReverse 8s linear infinite;
}

.ring-three {
    width: 195px;
    height: 195px;
    border-top-color: #00ff9d;
    border-bottom-color: #00aaff;
    animation: spin 5s linear infinite;
}

/* MARCADORES */

.marker {
    position: absolute;
    width: 12px;
    height: 12px;
    border: 2px solid #00aaff;
    box-shadow: 0 0 10px #00aaff;
}

.marker-one {
    top: 17px;
    left: 50%;
}

.marker-two {
    right: 17px;
    top: 50%;
}

.marker-three {
    bottom: 17px;
    left: 50%;
}

.marker-four {
    left: 17px;
    top: 50%;
}

        #ffffff 0%,

        #00c8ff 20%,
        #006
