<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J.A.R.V.I.S.</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    min-height: 100vh;
    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #06202a 0%,
            #02080c 35%,
            #000000 75%
        );

    color: white;
    font-family: Arial, Helvetica, sans-serif;
}


/* =========================
   FUNDO
========================= */

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 49px,
            rgba(0, 255, 200, 0.025) 50px
        ),
        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 49px,
            rgba(0, 180, 255, 0.025) 50px
        );
}


/* =========================
   INTERFACE
========================= */

.interface {
    position: relative;

    width: 100%;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding-top: 35px;
}


/* =========================
   TÍTULO
========================= */

.title {
    font-size: 34px;

    letter-spacing: 10px;

    font-weight: 300;

    color: #e8ffff;

    text-shadow:
        0 0 8px #00eaff,
        0 0 25px rgba(0, 234, 255, 0.5);
}

.subtitle {
    margin-top: 7px;

    font-size: 10px;

    letter-spacing: 5px;

    color: #00ffbf;

    opacity: 0.8;
}


/* =========================
   NÚCLEO
========================= */

.reactor {
    position: relative;

    width: 300px;
    height: 300px;

    margin-top: 35px;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* círculo externo */

.circle1 {
    position: absolute;

    width: 280px;
    height: 280px;

    border-radius: 50%;

    border:
        1px solid rgba(0, 210, 255, 0.5);

    box-shadow:
        0 0 25px rgba(0, 210, 255, 0.15);

    animation:
        rotate 18s linear infinite;
}


/* círculo verde */

.circle2 {
    position: absolute;

    width: 230px;
    height: 230px;

    border-radius: 50%;

    border:
        2px dashed rgba(0, 255, 170, 0.65);

    animation:
        rotateReverse 12s linear infinite;
}


/* círculo interno */

.circle3 {
    position: absolute;

    width: 175px;
    height: 175px;

    border-radius: 50%;

    border:
        1px solid rgba(255, 255, 255, 0.5);

    box-shadow:
        inset 0 0 20px rgba(0, 220, 255, 0.2);

    animation:
        pulse 3s ease-in-out infinite;
}


/* linhas */

.circle1::before,
.circle1::after {

    content: "";

    position: absolute;

    top: 50%;
    left: 50%;

    width: 320px;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0, 220, 255, 0.5),
            transparent
        );

    transform: translate(-50%, -50%);
}


.circle1::after {

    transform:
        translate(-50%, -50%)
        rotate(90deg);
}


/* =========================
   NÚCLEO CENTRAL
========================= */

.core {

    position: absolute;

    width: 90px;
    height: 90px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #00ffff 12%,
            #00aaff 35%,
            #006078 60%,
            transparent 72%
        );

    box-shadow:

        0 0 10px #ffffff,

        0 0 25px #00eaff,

        0 0 50px #00aaff,

        0 0 90px rgba(0, 200, 255, 0.7);

    animation:
        reactorPulse 2s ease-in-out infinite;
}


/* =========================
   STATUS
========================= */

.status {

    margin-top: 5px;

    font-size: 11px;

    letter-spacing: 4px;

    color: #00ffb7;

    text-shadow:
        0 0 8px #00ffb7;
}

.status span {
    color: white;
}


/* =========================
   RESPOSTA
========================= */

.response {

    width: 90%;

    max-width: 500px;

    margin-top: 25px;

    text-align: center;
}


.response-label {

    font-size: 9px;

    letter-spacing: 4px;

    color: #00bfff;

    margin-bottom: 10px;
}


#response {

    min-height: 45px;

    padding: 12px;

    color: #dfffff;

    font-size: 15px;

    line-height: 1.5;

    text-shadow:
        0 0 8px rgba(0, 220, 255, 0.5);
}


/* =========================
   BOTÃO
========================= */

#talkButton {

    margin-top: 18px;

    padding: 15px 30px;

    border-radius: 50px;

    border:
        1px solid #00eaff;

    background:
        rgba(0, 180, 255, 0.06);

    color: white;

    font-size: 13px;

    letter-spacing: 3px;

    box-shadow:
        0 0 15px rgba(0, 220, 255, 0.25);

    cursor: pointer;

    transition: 0.3s;
}


#talkButton:hover {

    background:
        rgba(0, 220, 255, 0.15);

    box-shadow:
        0 0 30px rgba(0, 220, 255, 0.6);

    transform: scale(1.04);
}


#talkButton:active {

    transform: scale(0.96);
}


/* =========================
   DECORAÇÕES
========================= */

.corner {

    position: fixed;

    width: 45px;
    height: 45px;

    border-color:
        rgba(0, 220, 255, 0.5);

    border-style: solid;

    opacity: 0.6;
}


.top-left {

    top: 20px;
    left: 20px;

    border-width:
        1px 0 0 1px;
}


.top-right {

    top: 20px;
    right: 20px;

    border-width:
        1px 1px 0 0;
}


.bottom-left {

    bottom: 20px;
    left: 20px;

    border-width:
        0 0 1px 1px;
}


.bottom-right {

    bottom: 20px;
    right: 20px;

    border-width:
        0 1px 1px 0;
}


/* =========================
   ANIMAÇÕES
========================= */

@keyframes rotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


@keyframes rotateReverse {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}


@keyframes pulse {

    0%, 100% {
        transform: scale(0.96);
        opacity: 0.5;
    }

    50% {
        transform: scale(1.04);
        opacity: 1;
    }
}


@keyframes reactorPulse {

    0%, 100% {

        transform: scale(0.92);

        filter:
            brightness(0.9);
    }

    50% {

        transform: scale(1.08);

        filter:
            brightness(1.4);
    }
}

</style>
</head>


<body>

<div class="background"></div>


<div class="corner top-left"></div>
<div class="corner top-right"></div>
<div class="corner bottom-left"></div>
<div class="corner bottom-right"></div>


<main class="interface">


    <h1 class="title">
        J.A.R.V.I.S.
    </h1>


    <div class="subtitle">
        PERSONAL ARTIFICIAL INTELLIGENCE
    </div>


    <div class="reactor">

        <div class="circle1"></div>

        <div class="circle2"></div>

        <div class="circle3"></div>

        <div class="core"></div>

    </div>


    <div class="status">

        ● <span>SYSTEM ONLINE</span>

    </div>


    <section class="response">

        <div class="response-label">
            JARVIS RESPONSE
        </div>


        <div id="response">
            Boa noite, senhor.
        </div>

    </section>


    <button id="talkButton">
        🎙 FALAR COM JARVIS
    </button>


</main>


<script>


/* =========================
   ELEMENTOS
========================= */

const button =
    document.getElementById("talkButton");

const response =
    document.getElementById("response");


/* =========================
   VOZ
========================= */

function falar(texto) {

    response.textContent = texto;


    if (!("speechSynthesis" in window)) {
        return;
    }


    speechSynthesis.cancel();


    const fala =
        new SpeechSynthesisUtterance(texto);


    fala.lang = "pt-BR";

    fala.rate = 1.15;

    fala.pitch = 0.78;

    fala.volume = 1;


    const vozes =
        speechSynthesis.getVoices();


    const voz =
        vozes.find(v =>
            v.lang &&
            v.lang.toLowerCase().startsWith("pt")
        );


    if (voz) {

        fala.voice = voz;

    }


    speechSynthesis.speak(fala);
}


/* =========================
   RECONHECIMENTO
========================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "pt-BR";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.onstart = function() {

        response.textContent =
            "Estou ouvindo, senhor...";

    };


    recognition.onresult =
        function(event) {

            const comando =
                event.results[0][0]
                .transcript
                .toLowerCase();


            executarComando(comando);

        };


    recognition.onerror =
        function() {

            response.textContent =
                "Não consegui entender, senhor.";

        };

}


/* =========================
   BOTÃO
========================= */

button.onclick = function() {


    if (!recognition) {

        falar(
            "O reconhecimento de voz não está disponível."
        );

        return;

    }


    try {

        recognition.start();

    } catch (erro) {

        console.log(erro);

    }

};


/* =========================
   COMANDOS
========================= */

function executarComando(comando) {


    if (
        comando.includes("ok jarvis") ||
        comando.includes("okay jarvis") ||
        comando === "jarvis"
    ) {

        falar(
            "Sim, senhor. Estou ouvindo."
        );

        return;
    }


    if (
        comando.includes("oi") ||
        comando.includes("olá") ||
        comando.includes("ola")
    ) {

        falar(
            "Olá, senhor. Como posso ajudar?"
        );

        return;
    }


    if (
        comando.includes("quem é você") ||
        comando.includes("quem e você") ||
        comando.includes("quem e voce")
    ) {

        falar(
            "Eu sou JARVIS, seu assistente pessoal."
        );

        return;
    }


    if (
        comando.includes("que horas são") ||
        comando.includes("que horas sao") ||
        comando.includes("horas")
    ) {

        const agora =
            new Date();


        const horas =
            agora.getHours()
            .toString()
            .padStart(2, "0");


        const minutos =
            agora.getMinutes()
            .toString()
            .padStart(2, "0");


        falar(
            "Agora são " +
            horas +
            " horas e " +
            minutos +
            " minutos."
        );

        return;
    }


    if (
        comando.includes("abrir google")
    ) {

        falar(
            "Abrindo o Google, senhor."
        );


        setTimeout(() => {

            window.open(
                "https://www.google.com",
                "_blank"
            );

        }, 1000);


        return;
    }


    if (
        comando.includes("abrir youtube")
    ) {

        falar(
            "Abrindo o YouTube, senhor."
        );


        setTimeout(() => {

            window.open(
                "https://www.youtube.com",
                "_blank"
            );

        }, 1000);


        return;
    }


    if (
        comando.includes("obrigado") ||
        comando.includes("valeu")
    ) {

        falar(
            "Sempre às ordens, senhor."
        );

        return;
    }


    falar(
        "Comando recebido, senhor. Ainda estou aprendendo."
    );

}


</script>

</body>
</html>
