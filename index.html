<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J.A.R.V.I.S.</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    width: 100%;
    min-height: 100vh;
    background: #020507;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

/* FUNDO */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        linear-gradient(
            rgba(0,170,255,0.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,170,255,0.035) 1px,
            transparent 1px
        );

    background-size: 35px 35px;
    pointer-events: none;
}

/* INTERFACE PRINCIPAL */

.jarvis {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 25px 18px 15px;

    position: relative;
}

/* TÍTULO */

.header {
    text-align: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 7px;

    color: white;

    text-shadow:
        0 0 8px #00aaff,
        0 0 20px rgba(0,170,255,0.7);
}

.subtitle {
    margin-top: 6px;

    font-size: 8px;
    letter-spacing: 3px;

    color: #667983;
}

/* NÚCLEO */

.core-container {

    width: 220px;
    height: 220px;

    margin-top: 18px;

    position: relative;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* BRILHO */

.core-glow {

    position: absolute;

    width: 120px;
    height: 120px;

    border-radius: 50%;

    background: #00aaff;

    filter: blur(35px);

    opacity: 0.12;

    animation: glow 2s infinite;
}

/* ANÉIS */

.ring {
    position: absolute;

    border-radius: 50%;

    border: 1px solid rgba(0,170,255,0.5);
}

.ring-one {

    width: 215px;
    height: 215px;

    border-top-color: #00aaff;
    border-bottom-color: #00ff9d;

    animation: rotate 9s linear infinite;
}

.ring-two {

    width: 180px;
    height: 180px;

    border-left-color: #00aaff;
    border-right-color: white;

    animation: rotateReverse 6s linear infinite;
}

.ring-three {

    width: 150px;
    height: 150px;

    border-top-color: #00ff9d;
    border-bottom-color: #00aaff;

    animation: rotate 4s linear infinite;
}
