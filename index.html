<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS</title>

<style>

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;

    height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

h1 {
    font-size: 32px;
    letter-spacing: 6px;
    margin-bottom: 10px;
}

p {
    color: #aaa;
    font-size: 18px;
    max-width: 90%;
}

button {
    margin-top: 30px;
    padding: 18px 25px;

    border: 1px solid white;
    border-radius: 50px;

    background: transparent;
    color: white;

    font-size: 16px;
}

button:active {
    background: white;
    color: black;
}

</style>

</head>

<body>

<h1>J.A.R.V.I.S.</h1>

<p id="mensagem">Boa noite, senhor.</p>

<button onclick="ouvir()">
🎙️ Falar com JARVIS
</button>

<script>

function falar(texto) {

    const voz =
        new SpeechSynthesisUtterance(texto);

    voz.lang = "pt-BR";
    voz.rate = 1;
    voz.pitch = 0.9;
    voz.volume = 1;

    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(voz);
}


function ouvir() {

    const mensagem =
        document.getElementById("mensagem");

    const Reconhecimento =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!Reconhecimento) {

        mensagem.innerText =
            "Seu navegador não suporta reconhecimento de voz.";

        falar(
            "Senhor, este navegador não suporta reconhecimento de voz."
        );

        return;
    }


    const reconhecimento =
        new Reconhecimento();


    reconhecimento.lang = "pt-BR";

    reconhecimento.continuous = false;

    reconhecimento.interimResults = false;


    mensagem.innerText =
        "🎙️ Estou ouvindo...";


    reconhecimento.start();


    reconhecimento.onresult =
        function(event) {

            const texto =
                event.results[0][0].transcript;

            mensagem.innerText =
                "Você disse: " + texto;

            responder(texto);
        };


    reconhecimento.onerror =
        function(event) {

            mensagem.innerText =
                "Erro no microfone: " +
                event.error;
        };

}


function responder(texto) {

    texto =
        texto.toLowerCase().trim();


    /*
    ==========================
    ATIVAÇÃO DO JARVIS
    ==========================
    */

    if (
        texto.includes("ok jarvis") ||
        texto.includes("okay jarvis") ||
        texto.includes("jarvis")
    ) {

        falar(
            "Sim, senhor. Estou ouvindo."
        );

        document.getElementById("mensagem")
            .innerText =
            "Sim, senhor. Estou ouvindo.";

        return;
    }


    /*
    ==========================
    SAUDAÇÃO
    ==========================
    */

    if (
        texto.includes("oi") ||
        texto.includes("olá") ||
        texto.includes("ola")
    ) {

        falar(
            "Olá, senhor. Como posso ajudar?"
        );

        document.getElementById("mensagem")
            .innerText =
            "Olá, senhor. Como posso ajudar?";

        return;
    }


    /*
    ==========================
    QUEM É O JARVIS
    ==========================
    */

    if (
        texto.includes("quem é você") ||
        texto.includes("quem e você") ||
        texto.includes("quem e voce")
    ) {

        falar(
            "Eu sou JARVIS, seu assistente pessoal."
        );

        document.getElementById("mensagem")
            .innerText =
            "Eu sou JARVIS, seu assistente pessoal.";

        return;
    }


    /*
    ==========================
    HORA
    ==========================
    */

    if (
        texto.includes("que horas são") ||
        texto.includes("que horas sao") ||
        texto.includes("horas")
    ) {

        const agora =
            new Date();

        const horas =
            agora.getHours()
                .toString()
                .padStart(2, "0");

        const minutos =
            agora.getMinutes()
                .toString()
                .padStart(2, "0");


        const resposta =
            "Senhor, agora são " +
            horas +
            " horas e " +
            minutos +
            " minutos.";


        document.getElementById("mensagem")
            .innerText =
            resposta;

        falar(resposta);

        return;
    }


    /*
    ==========================
    ABRIR GOOGLE
    ==========================
    */

    if (
        texto.includes("abrir google") ||
        texto.includes("abre o google")
    ) {

        falar(
            "Abrindo o Google, senhor."
        );

        document.getElementById("mensagem")
            .innerText =
            "Abrindo Google...";

        window.open(
            "https://www.google.com",
            "_blank"
        );

        return;
    }


    /*
    ==========================
    ABRIR YOUTUBE
    ==========================
    */

    if (
        texto.includes("abrir youtube") ||
        texto.includes("abre o youtube")
    ) {

        falar(
            "Abrindo o YouTube, senhor."
        );

        document.getElementById("mensagem")
            .innerText =
            "Abrindo YouTube...";

        window.open(
            "https://www.youtube.com",
            "_blank"
        );

        return;
    }


    /*
    ==========================
    AGRADECIMENTO
    ==========================
    */

    if (
        texto.includes("obrigado") ||
        texto.includes("obrigada")
    ) {

        falar(
            "Sempre às ordens, senhor."
        );

        document.getElementById("mensagem")
            .innerText =
            "Sempre às ordens, senhor.";

        return;
    }


    /*
    ==========================
    COMANDO DESCONHECIDO
    ==========================
    */

    const resposta =
        "Comando recebido, senhor. Ainda estou aprendendo a responder a esse tipo de comando.";


    document.getElementById("mensagem")
        .innerText =
        resposta;

    falar(resposta);

}

</script>

</body>

</html>
