<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS</title>

<style>

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;

    height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

h1 {
    font-size: 32px;
    letter-spacing: 6px;
    margin-bottom: 10px;
}

p {
    color: #aaa;
    font-size: 18px;
    max-width: 90%;
}

button {
    margin-top: 30px;
    padding: 18px 25px;

    border: 1px solid white;
    border-radius: 50px;

    background: transparent;
    color: white;

    font-size: 16px;
}

button:active {
    background: white;
    color: black;
}

</style>

</head>

<body>

<h1>J.A.R.V.I.S.</h1>

<p id="mensagem">Boa noite, senhor.</p>

<button onclick="ouvir()">
🎙️ Falar com JARVIS
</button>

<script>

function falar(texto) {

    const voz = new SpeechSynthesisUtterance(texto);

    voz.lang = "pt-BR";
    voz.rate = 1;
    voz.pitch = 0.9;
    voz.volume = 1;

    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(voz);
}

function ouvir() {

    const mensagem =
        document.getElementById("mensagem");

    const Reconhecimento =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!Reconhecimento) {

        mensagem.innerText =
            "Seu navegador não suporta reconhecimento de voz.";

        falar("Senhor, este navegador não suporta reconhecimento de voz.");

        return;
    }

    const reconhecimento =
        new Reconhecimento();

    reconhecimento.lang = "pt-BR";

    reconhecimento.continuous = false;

    reconhecimento.interimResults = false;

    mensagem.innerText =
        "🎙️ Estou ouvindo...";

    reconhecimento.start();

    reconhecimento.onresult = function(event) {

        const texto =
            event.results[0][0].transcript;

        mensagem.innerText =
            "Você disse: " + texto;

        responder(texto);

    };

    reconhecimento.onerror = function(event) {

        mensagem.innerText =
            "Erro no microfone: " + event.error;

    };

}

function responder(texto) {

    texto = texto.toLowerCase();

    if (texto.includes("olá") ||
        texto.includes("ola") ||
        texto.includes("oi")) {

        const resposta =
            "Olá, senhor. Como posso ajudar?";

        document.getElementById("mensagem")
            .innerText = resposta;

        falar(resposta);

    } else {

        const resposta =
            "Comando recebido, senhor. Ainda estou aprendendo a responder a esse tipo de comando.";

        document.getElementById("mensagem")
            .innerText = resposta;

        falar(resposta);
    }

}

</script>

</body>

</html>
